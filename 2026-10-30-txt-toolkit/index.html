<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>文本手术刀 · 一键清洗与统计</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --line:#262b36; --fg:#e6e8ee;
    --dim:#8b93a7; --acc:#6ea8fe; --ok:#3ddc97; --warn:#ffb454;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:24px;background:var(--bg);color:var(--fg);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  }
  .wrap{max-width:1180px;margin:0 auto}
  h1{font-size:22px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:13px;margin-bottom:20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media(max-width:860px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px}
  .panel h2{font-size:13px;color:var(--dim);margin:0 0 10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
  textarea{
    width:100%;height:300px;resize:vertical;background:#0c0e13;color:var(--fg);
    border:1px solid var(--line);border-radius:8px;padding:12px;
    font:13px/1.65 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  textarea:focus{outline:none;border-color:var(--acc)}
  .ops{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
  button{
    background:#212734;color:var(--fg);border:1px solid var(--line);border-radius:8px;
    padding:7px 12px;font-size:13px;cursor:pointer;transition:.15s;
  }
  button:hover{background:#2a3242;border-color:#39435a}
  button.primary{background:var(--acc);color:#0b1220;border-color:var(--acc);font-weight:600}
  button.primary:hover{filter:brightness(1.1)}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(96px,1fr));gap:10px;margin-top:14px}
  .stat{background:#0c0e13;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
  .stat b{display:block;font-size:19px;color:var(--acc);font-variant-numeric:tabular-nums}
  .stat span{font-size:11px;color:var(--dim)}
  .toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:var(--ok);color:#06231a;padding:9px 16px;border-radius:8px;
    font-size:13px;font-weight:600;opacity:0;pointer-events:none;transition:.22s;
  }
  .toast.show{opacity:1;transform:translate(-50%,0)}
  .row{display:flex;justify-content:space-between;align-items:center;gap:10px}
  .hint{color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>🔪 文本手术刀</h1>
  <div class="sub">粘贴 → 一键清洗 → 看统计（全程本地运行，不联网、不上传）</div>

  <div class="grid">
    <div class="panel">
      <div class="row">
        <h2 style="margin:0">输入</h2>
        <span class="hint" id="in-hint">0 字符</span>
      </div>
      <textarea id="input" placeholder="把从 PDF / 网页 / 微信里复制出来的脏文本粘在这里…"></textarea>
      <div class="ops">
        <button class="primary" data-op="clean">✨ 一键清洗</button>
        <button data-op="trim">去首尾空白</button>
        <button data-op="blank">删空行</button>
        <button data-op="clip">复制结果</button>
        <button data-op="clear">清空</button>
      </div>
    </div>

    <div class="panel">
      <div class="row">
        <h2 style="margin:0">输出</h2>
        <span class="hint" id="out-hint">0 字符</span>
      </div>
      <textarea id="output" placeholder="处理结果会出现在这里…"></textarea>
      <div class="stats" id="stats"></div>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>

<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const statsBox = document.getElementById('stats');
const toastEl = document.getElementById('toast');

function toast(msg, color){
  toastEl.textContent = msg;
  toastEl.style.background = color || 'var(--ok)';
  toastEl.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(()=>toastEl.classList.remove('show'), 1600);
}

/* ---------- 核心：清洗规则 ---------- */
function cleanText(s){
  return s
    // 全角空格 / 不间断空格 → 普通空格
    .replace(/[\u00A0\u3000]/g, ' ')
    // 常见乱码控制符
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    // 中文之间的换行：PDF 复制最常见的问题，先粘回去
    .replace(/([\u4e00-\u9fa5，。；：、！？）】」])\s*\n\s*([\u4e00-\u9fa5（【「])/g, '$1$2')
    // 中文之间的多余空格
    .replace(/([\u4e00-\u9fa5])\s+([\u4e00-\u9fa5])/g, '$1$2')
    // 行尾空白
    .replace(/[ \t]+$/gm, '')
    // 连续空行压成一个
    .replace(/\n{3,}/g, '\n\n')
    // 全角标点后的多余空格
    .replace(/([，。；：！？、])\s+/g, '$1')
    .trim();
}

/* ---------- 统计 ---------- */
function analyze(s){
  const noSpace = s.replace(/\s/g,'');
  const cjk = (s.match(/[\u4e00-\u9fa5]/g) || []).length;
  const words = (s.match(/[A-Za-z][A-Za-z'-]*/g) || []).length;
  const lines = s === '' ? 0 : s.split('\n').length;
  const paras = s.trim() === '' ? 0 : s.trim().split(/\n\s*\n/).length;
  return [
    ['字符', s.length],
    ['字符(不含空白)', noSpace.length],
    ['中文字', cjk],
    ['英文词', words],
    ['行数', lines],
    ['段落', paras],
    ['预计阅读', Math.max(1, Math.ceil((cjk + words) / 400)) + ' 分钟'],
  ];
}

function renderStats(){
  const rows = analyze(output.value);
  statsBox.innerHTML = rows
    .map(([k,v]) => `<div class="stat"><b>${v}</b><span>${k}</span></div>`)
    .join('');
  document.getElementById('out-hint').textContent = output.value.length + ' 字符';
  document.getElementById('in-hint').textContent = input.value.length + ' 字符';
}

/* ---------- 交互 ---------- */
document.querySelectorAll('button[data-op]').forEach(btn => {
  btn.addEventListener('click', async () => {
    const op = btn.dataset.op;
    if (op === 'clean') {
      if (!input.value.trim()) return toast('先粘贴点内容吧 🙂', 'var(--warn)');
      output.value = cleanText(input.value);
      renderStats();
      toast('清洗完成');
    } else if (op === 'trim') {
      output.value = output.value.split('\n').map(l => l.trim()).join('\n').trim();
      renderStats();
      toast('已去首尾空白');
    } else if (op === 'blank') {
      output.value = output.value.split('\n').filter(l => l.trim() !== '').join('\n');
      renderStats();
      toast('已删除空行');
    } else if (op === 'clip') {
      const text = output.value || input.value;
      if (!text) return toast('没有可复制的内容', 'var(--warn)');
      try {
        await navigator.clipboard.writeText(text);
        toast('已复制到剪贴板');
      } catch {
        toast('浏览器不允许访问剪贴板', 'var(--warn)');
      }
    } else if (op === 'clear') {
      input.value = ''; output.value = '';
      renderStats();
    }
  });
});

input.addEventListener('input', () => {
  document.getElementById('in-hint').textContent = input.value.length + ' 字符';
});
output.addEventListener('input', renderStats);

renderStats();
</script>
</body>
</html>
