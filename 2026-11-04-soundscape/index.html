<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>声景 · Soundscape</title>
<meta name="description" content="本地合成的白噪音混音器，六种环境音可自由叠加调音，预设开场，睡眠定时渐弱。">
<style>
  :root {
    --bg: #07090e;
    --panel: rgba(255,255,255,.045);
    --panel-2: rgba(255,255,255,.075);
    --line: rgba(255,255,255,.09);
    --txt: #e9eef6;
    --dim: #8b97a8;
    --accent: #7fc4ff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    color: var(--txt);
    background: var(--bg);
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }
  /* 背景：会随播放缓慢呼吸的极光 */
  body::before {
    content: "";
    position: fixed; inset: -20%;
    background:
      radial-gradient(38% 42% at 22% 28%, rgba(60,130,220,.30), transparent 70%),
      radial-gradient(40% 38% at 78% 22%, rgba(120,80,200,.24), transparent 70%),
      radial-gradient(45% 45% at 55% 85%, rgba(30,150,150,.20), transparent 70%);
    filter: blur(30px);
    opacity: .55;
    transition: opacity 1.2s ease;
    z-index: -2;
    animation: drift 26s ease-in-out infinite alternate;
  }
  body.playing::before { opacity: 1; }
  @keyframes drift {
    0%   { transform: scale(1) translate(0,0) rotate(0deg); }
    50%  { transform: scale(1.08) translate(-2%, 2%) rotate(4deg); }
    100% { transform: scale(1.04) translate(3%, -2%) rotate(-3deg); }
  }
  body::after {
    content: "";
    position: fixed; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,.035) 1px, transparent 1px);
    background-size: 3px 3px;
    z-index: -1;
    pointer-events: none;
  }

  .wrap {
    max-width: 1080px;
    margin: 0 auto;
    padding: 28px 20px 48px;
    position: relative;
  }

  header {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
    margin-bottom: 22px;
  }
  h1 {
    margin: 0;
    font-size: 27px;
    font-weight: 650;
    letter-spacing: .5px;
  }
  h1 em {
    font-style: normal;
    color: var(--accent);
    text-shadow: 0 0 24px rgba(127,196,255,.55);
  }
  .sub { color: var(--dim); font-size: 13px; margin-top: 4px; }

  /* ---- 播放条 ---- */
  .deck {
    display: flex;
    align-items: center;
    gap: 16px;
    flex-wrap: wrap;
    padding: 16px 18px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid var(--line);
    backdrop-filter: blur(14px);
  }
  #playBtn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 12px 22px;
    font-size: 15px;
    font-weight: 600;
    color: #04121f;
    background: linear-gradient(135deg, #9fd8ff, #63b3ff);
    border: 0;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 8px 26px -8px rgba(99,179,255,.8);
    transition: transform .15s, box-shadow .25s, background .3s;
  }
  #playBtn:hover { transform: translateY(-1px); box-shadow: 0 12px 30px -8px rgba(99,179,255,.95); }
  #playBtn:active { transform: translateY(0) scale(.985); }
  #playBtn.active {
    background: linear-gradient(135deg, #ffd9a0, #ffb45e);
    color: #2a1600;
    box-shadow: 0 8px 26px -8px rgba(255,180,94,.8);
  }

  #viz {
    flex: 1 1 220px;
    min-width: 180px;
    height: 62px;
    border-radius: 12px;
    background: rgba(0,0,0,.22);
    border: 1px solid var(--line);
  }

  .master-box { display: flex; align-items: center; gap: 10px; min-width: 190px; }
  .master-box label { font-size: 12px; color: var(--dim); white-space: nowrap; }
  #masterVal {
    font-variant-numeric: tabular-nums;
    font-size: 12px;
    color: var(--accent);
    width: 42px;
    text-align: right;
  }

  #status {
    font-size: 12px;
    color: var(--dim);
    margin-left: auto;
    white-space: nowrap;
  }

  /* ---- 通用滑块 ---- */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 4px;
    background: rgba(255,255,255,.14);
    outline: none;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 15px; height: 15px;
    border-radius: 50%;
    background: #cfe6ff;
    border: 0;
    box-shadow: 0 0 0 3px rgba(127,196,255,.18);
    transition: box-shadow .2s, transform .15s;
  }
  input[type=range]::-webkit-slider-thumb:hover { transform: scale(1.15); box-shadow: 0 0 0 6px rgba(127,196,255,.22); }
  input[type=range]::-moz-range-thumb {
    width: 15px; height: 15px; border-radius: 50%; background: #cfe6ff; border: 0;
  }

  /* ---- 分轨卡片 ---- */
  #grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
    gap: 14px;
    margin-top: 20px;
  }
  .ch {
    padding: 15px 16px 13px;
    border-radius: 16px;
    background: var(--panel);
    border: 1px solid var(--line);
    transition: border-color .3s, background .3s, transform .2s;
  }
  .ch.on {
    background: hsl(var(--hue) 70% 55% / .10);
    border-color: hsl(var(--hue) 80% 62% / .42);
    box-shadow: 0 0 0 1px hsl(var(--hue) 80% 62% / .10) inset,
                0 10px 40px -22px hsl(var(--hue) 90% 60% / .9);
  }
  .ch-top {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 11px;
  }
  .ch-icon {
    font-size: 19px;
    cursor: pointer;
    user-select: none;
    filter: grayscale(.85) opacity(.65);
    transition: filter .3s, transform .2s;
  }
  .ch-icon:hover { transform: scale(1.18) rotate(-6deg); }
  .ch.on .ch-icon { filter: none; }
  .ch-name { font-weight: 600; font-size: 14px; }
  .ch-val {
    margin-left: auto;
    font-size: 12px;
    font-variant-numeric: tabular-nums;
    color: var(--dim);
  }
  .ch.on .ch-val { color: hsl(var(--hue) 90% 74%); }
  .ch.on input[type=range] { background: hsl(var(--hue) 60% 60% / .28); }
  .ch.on input[type=range]::-webkit-slider-thumb {
    background: hsl(var(--hue) 95% 74%);
    box-shadow: 0 0 0 3px hsl(var(--hue) 95% 74% / .22);
  }
  .ch-hint {
    margin-top: 9px;
    font-size: 11.5px;
    line-height: 1.45;
    color: var(--dim);
    opacity: .8;
    min-height: 2.6em;
  }

  /* ---- 预设 ---- */
  .section-title {
    margin: 30px 0 12px;
    font-size: 12px;
    letter-spacing: 2.4px;
    text-transform: uppercase;
    color: var(--dim);
    display: flex; align-items: center; gap: 10px;
  }
  .section-title::after {
    content: ""; flex: 1; height: 1px; background: var(--line);
  }
  #presets {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
    gap: 12px;
  }
  .preset {
    text-align: left;
    padding: 14px 15px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--txt);
    font: inherit;
    cursor: pointer;
    transition: transform .18s, border-color .25s, background .25s;
  }
  .preset:hover { transform: translateY(-2px); background: var(--panel-2); border-color: rgba(127,196,255,.4); }
  .preset.current {
    border-color: var(--accent);
    background: rgba(127,196,255,.10);
    box-shadow: 0 0 0 1px rgba(127,196,255,.2) inset;
  }
  .preset-name { font-weight: 640; font-size: 14px; margin-bottom: 3px; }
  .preset-desc { font-size: 12px; color: var(--dim); line-height: 1.45; min-height: 2.9em; }
  .preset-mix { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
  .pill {
    font-size: 11px;
    padding: 2.5px 8px;
    border-radius: 999px;
    background: hsl(var(--hue) 70% 60% / .18);
    border: 1px solid hsl(var(--hue) 80% 65% / .35);
    color: hsl(var(--hue) 90% 82%);
  }
  .pill b { font-weight: 600; opacity: .8; }

  /* ---- 底部：定时 + 快捷键 ---- */
  .foot {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    align-items: center;
    margin-top: 18px;
    padding: 14px 16px;
    border-radius: 14px;
    background: var(--panel);
    border: 1px solid var(--line);
    font-size: 13px;
  }
  .foot .lbl { color: var(--dim); font-size: 12px; }
  .timer-btn {
    padding: 6px 13px;
    border-radius: 999px;
    border: 1px solid var(--line);
    background: transparent;
    color: var(--txt);
    font: inherit;
    font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }
  .timer-btn:hover { border-color: rgba(127,196,255,.5); color: var(--accent); }
  .timer-btn.active {
    background: rgba(127,196,255,.16);
    border-color: var(--accent);
    color: var(--accent);
  }
  #timerLeft {
    font-variant-numeric: tabular-nums;
    color: #ffc978;
    font-size: 12px;
    min-width: 62px;
  }
  #stopAll {
    margin-left: auto;
    padding: 7px 15px;
    border-radius: 999px;
    border: 1px solid rgba(255,120,120,.35);
    background: rgba(255,120,120,.08);
    color: #ffb3b3;
    font: inherit; font-size: 12px;
    cursor: pointer;
    transition: all .2s;
  }
  #stopAll:hover { background: rgba(255,120,120,.18); }

  kbd {
    display: inline-block;
    padding: 1px 6px;
    border-radius: 5px;
    border: 1px solid var(--line);
    background: rgba(255,255,255,.06);
    font: 11px/1.7 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--dim);
  }
  .keys { margin-top: 16px; font-size: 12px; color: var(--dim); line-height: 2; }
  .keys span { margin-right: 14px; white-space: nowrap; }

  @media (max-width: 620px) {
    .wrap { padding: 18px 14px 40px; }
    h1 { font-size: 22px; }
    #viz { order: 3; flex-basis: 100%; }
    #status { display: none; }
    .master-box { flex: 1; }
    #stopAll { margin-left: 0; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>声景 <em>Soundscape</em></h1>
      <div class="sub">六种环境音，自由叠成你此刻想要的那片空气 · 全部实时合成，零音频文件</div>
    </div>
  </header>

  <div class="deck">
    <button id="playBtn">▶ <span>开始聆听</span></button>
    <canvas id="viz" aria-hidden="true"></canvas>
    <div class="master-box">
      <label for="master">总音量</label>
      <input type="range" id="master" min="0" max="100" value="80" aria-label="总音量">
      <span id="masterVal">80%</span>
    </div>
    <div id="status">已暂停</div>
  </div>

  <div id="grid"></div>

  <div class="section-title">预设场景</div>
  <div id="presets"></div>

  <div class="foot">
    <span class="lbl">睡眠定时</span>
    <button class="timer-btn" data-min="15">15 分</button>
    <button class="timer-btn" data-min="30">30 分</button>
    <button class="timer-btn" data-min="60">60 分</button>
    <button class="timer-btn" data-min="90">90 分</button>
    <button class="timer-btn" data-min="0">关闭</button>
    <span id="timerLeft"></span>
    <button id="stopAll">全部静音</button>
  </div>

  <div class="keys">
    <span><kbd>空格</kbd> 播放 / 暂停</span>
    <span><kbd>1</kbd>–<kbd>6</kbd> 开关对应音轨</span>
    <span><kbd>M</kbd> 总音量静音切换</span>
    <span>鼠标悬停卡片滚轮 微调音量</span>
    <span>点图标 单轨静音</span>
  </div>
</div>

<script src="audio.js"></script>
<script src="app.js"></script>
</body>
</html>
