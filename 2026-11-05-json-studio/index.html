<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JSON 工坊 · 格式化 / 校验 / 转 JS / 扁平化</title>
<style>
  :root {
    --bg: #0f1115;
    --panel: #161a21;
    --panel-2: #1c212a;
    --line: #2a3040;
    --text: #dfe6f0;
    --dim: #8792a6;
    --accent: #6ee7b7;
    --accent-2: #7dd3fc;
    --err: #fb7185;
    --warn: #fbbf24;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", "JetBrains Mono", Menlo, Consolas, "Noto Sans Mono CJK SC", monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background:
      radial-gradient(1000px 500px at 85% -10%, rgba(110,231,183,.07), transparent 60%),
      radial-gradient(800px 400px at -10% 110%, rgba(125,211,252,.07), transparent 60%),
      var(--bg);
    color: var(--text);
    font: 14px/1.55 system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    display: flex; align-items: center; gap: 12px; padding: 12px 18px;
    border-bottom: 1px solid var(--line); backdrop-filter: blur(8px);
  }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .3px; }
  header h1 .mark { color: var(--accent); }
  header .sub { color: var(--dim); font-size: 12px; }
  header .spacer { flex: 1; }
  .status { font-size: 12px; font-family: var(--mono); padding: 3px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--dim); white-space: nowrap; }
  .status.ok { color: var(--accent); border-color: rgba(110,231,183,.35); background: rgba(110,231,183,.08); }
  .status.bad { color: var(--err); border-color: rgba(251,113,133,.35); background: rgba(251,113,133,.08); }
  .status.warn { color: var(--warn); border-color: rgba(251,191,36,.35); background: rgba(251,191,36,.08); }

  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 18px; border-bottom: 1px solid var(--line); align-items: center; }
  button, select, label.chk {
    font: inherit; font-size: 12.5px; color: var(--text); background: var(--panel-2);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 11px; cursor: pointer;
    transition: border-color .15s, background .15s, transform .08s;
  }
  button:hover, select:hover, label.chk:hover { border-color: #3b4458; background: #232a35; }
  button:active { transform: translateY(1px); }
  button.primary { background: rgba(110,231,183,.14); border-color: rgba(110,231,183,.45); color: var(--accent); font-weight: 600; }
  button.primary:hover { background: rgba(110,231,183,.22); }
  button.ghost { background: transparent; }
  label.chk { display: inline-flex; gap: 6px; align-items: center; user-select: none; }
  label.chk input { accent-color: var(--accent); margin: 0; }
  .sep { width: 1px; height: 22px; background: var(--line); margin: 0 4px; }

  main { flex: 1; display: grid; grid-template-columns: 1fr 1fr; min-height: 0; }
  .pane { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  .pane + .pane { border-left: 1px solid var(--line); }
  .pane-head {
    display: flex; align-items: center; gap: 8px; padding: 8px 14px; font-size: 12px; color: var(--dim);
    border-bottom: 1px solid var(--line); background: rgba(255,255,255,.015);
  }
  .pane-head .t { font-weight: 600; color: var(--text); letter-spacing: .4px; }
  .pane-head .grow { flex: 1; }

  .editor-wrap { flex: 1; position: relative; min-height: 0; }
  textarea, pre.code {
    margin: 0; width: 100%; height: 100%; border: 0; outline: 0; resize: none;
    background: transparent; color: var(--text); font: 13px/1.6 var(--mono);
    tab-size: 2; padding: 14px 16px; white-space: pre; overflow: auto;
  }
  textarea::placeholder { color: #4d5769; }
  pre.code { overflow: auto; }
  .errline { position: absolute; left: 0; right: 0; height: 20.8px; background: rgba(251,113,133,.12); border-top: 1px solid rgba(251,113,133,.35); border-bottom: 1px solid rgba(251,113,133,.35); pointer-events: none; display: none; }

  /* 高亮层（叠在 textarea 后面） */
  .hl-wrap { position: absolute; inset: 0; overflow: auto; pointer-events: none; }
  .hl { font: 13px/1.6 var(--mono); padding: 14px 16px; white-space: pre-wrap; word-break: break-word; color: var(--text); }
  textarea.wrap { white-space: pre-wrap; word-break: break-word; }
  .t-key { color: #7dd3fc; }
  .t-str { color: #a7f3d0; }
  .t-num { color: #fbbf24; }
  .t-bool { color: #f0abfc; }
  .t-null { color: #fb7185; }
  .t-punc { color: #6b7689; }
  textarea.tinted { color: transparent; caret-color: #e2e8f0; }
  textarea.tinted::selection { background: rgba(110,231,183,.25); color: transparent; }

  /* 树 */
  .tree-view { overflow: auto; padding: 10px 14px; font: 13px/1.7 var(--mono); flex: 1; }
  .tnode { border-left: 1px dashed #262d3a; margin-left: 10px; padding-left: 8px; }
  .tnode.root { border: 0; margin: 0; padding: 0; }
  .trow { cursor: pointer; border-radius: 5px; padding: 0 4px; display: block; white-space: nowrap; }
  .trow:hover { background: rgba(255,255,255,.04); }
  .trow .caret { display: inline-block; width: 12px; color: var(--dim); }
  .trow .cnt { color: var(--dim); font-size: 11.5px; }
  .trow .pv { color: var(--dim); }
  .leaf { padding: 0 4px; white-space: nowrap; display: block; border-radius: 5px; }
  .leaf:hover { background: rgba(255,255,255,.04); }
  .leaf .k { color: #7dd3fc; }
  .leaf .colon { color: #6b7689; }
  .leaf .v { color: #a7f3d0; }
  .leaf .v.num { color: #fbbf24; }
  .leaf .v.bool { color: #f0abfc; }
  .leaf .v.null { color: #fb7185; }
  .leaf .path { color: #4d5769; margin-left: 10px; font-size: 11.5px; display: none; }
  .tree-view.show-paths .leaf .path { display: inline; }
  .collapsed > .tnode, .collapsed > .kids { display: none; }

  /* 表格视图 */
  .table-view { flex: 1; overflow: auto; padding: 10px 14px; font: 12.5px/1.6 var(--mono); }
  table { border-collapse: collapse; width: 100%; }
  th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid #222835; vertical-align: top; }
  th { color: var(--dim); font-weight: 500; position: sticky; top: 0; background: var(--panel); }
  tr:hover td { background: rgba(255,255,255,.025); }
  td.p { color: var(--accent-2); white-space: nowrap; }
  td.v { color: #a7f3d0; word-break: break-all; }

  .empty { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #4d5769; gap: 6px; font-size: 13px; }
  .empty kbd { font-family: var(--mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 5px; padding: 0 5px; font-size: 11.5px; color: var(--dim); }

  /* 统计条 */
  footer {
    display: flex; flex-wrap: wrap; gap: 18px; padding: 7px 18px; border-top: 1px solid var(--line);
    font-size: 12px; color: var(--dim); font-family: var(--mono); align-items: center;
  }
  footer b { color: var(--text); font-weight: 600; }
  footer .pill { padding: 1px 7px; border-radius: 999px; background: rgba(255,255,255,.04); }
  footer .gap { flex: 1; }

  /* toast */
  #toast { position: fixed; left: 50%; bottom: 56px; transform: translate(-50%, 20px); opacity: 0;
    background: #232a35; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    padding: 8px 14px; font-size: 13px; pointer-events: none; transition: .22s; box-shadow: 0 10px 30px rgba(0,0,0,.4); z-index: 50; }
  #toast.show { opacity: 1; transform: translate(-50%, 0); }

  /* 修复提示条 */
  .repair { display: none; align-items: center; gap: 10px; padding: 7px 18px; font-size: 12.5px;
    background: rgba(251,191,36,.07); border-bottom: 1px solid rgba(251,191,36,.22); color: #fcd34d; }
  .repair.show { display: flex; }
  .repair button { padding: 3px 9px; font-size: 12px; }

  dialog {
    background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 14px;
    padding: 0; width: min(720px, 92vw); max-height: 80vh; box-shadow: 0 24px 70px rgba(0,0,0,.6);
  }
  dialog::backdrop { background: rgba(0,0,0,.55); backdrop-filter: blur(3px); }
  .dlg-head { display: flex; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-weight: 600; font-size: 13.5px; }
  .dlg-head .spacer { flex: 1; }
  .dlg-body { padding: 14px 16px; display: grid; gap: 10px; }
  .dlg-body label { font-size: 12.5px; color: var(--dim); display: grid; gap: 5px; }
  .dlg-body input, .dlg-body textarea { font: 13px var(--mono); background: var(--panel-2); color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; }
  .dlg-body textarea { min-height: 180px; resize: vertical; white-space: pre; }
  .dlg-body .out { font: 12px var(--mono); color: var(--accent); word-break: break-all; }
  .dlg-foot { display: flex; gap: 8px; padding: 10px 16px; border-top: 1px solid var(--line); }
  .dlg-foot .spacer { flex: 1; }
  kbd.esc { border: 1px solid var(--line); border-radius: 4px; padding: 0 4px; font-size: 10.5px; color: var(--dim); }

  @media (max-width: 820px) {
    main { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
    .pane + .pane { border-left: 0; border-top: 1px solid var(--line); }
    header .sub { display: none; }
  }
</style>
</head>
<body>
<header>
  <h1><span class="mark">{ }</span> JSON 工坊</h1>
  <span class="sub">格式化 · 校验 · 转 JS · 扁平化 —— 全部在本地跑，不联网</span>
  <span class="spacer"></span>
  <span id="status" class="status">等待输入</span>
</header>

<div class="toolbar">
  <button class="primary" id="btnFormat" title="Ctrl/⌘ + Enter">格式化</button>
  <button id="btnMinify">压缩</button>
  <button id="btnEscape">转义为字符串</button>
  <button id="btnUnescape">去转义</button>
  <span class="sep"></span>
  <select id="indent" title="缩进">
    <option value="2" selected>2 空格</option>
    <option value="4">4 空格</option>
    <option value="tab">Tab</option>
    <option value="0">不缩进</option>
  </select>
  <label class="chk"><input type="checkbox" id="sortKeys"> 键排序</label>
  <label class="chk"><input type="checkbox" id="jsStyle"> JS 对象字面量</label>
  <span class="sep"></span>
  <button id="btnSample">来点示例</button>
  <button id="btnClear" class="ghost">清空</button>
  <button id="btnFile" class="ghost">打开文件</button>
  <input type="file" id="fileInput" accept=".json,.txt,.jsonc,application/json" hidden>
  <span class="spacer" style="flex:1"></span>
  <button id="btnCopy">复制结果</button>
  <button id="btnDownload" class="ghost">下载 .json</button>
</div>

<div class="repair" id="repairBar">
  <span id="repairText"></span>
  <button id="btnApplyRepair">应用修复</button>
  <span class="spacer" style="flex:1"></span>
  <button id="btnIgnoreRepair" class="ghost">忽略</button>
</div>

<main>
  <section class="pane">
    <div class="pane-head">
      <span class="t">输入</span>
      <span id="inMeta" style="font-family:var(--mono)"></span>
      <span class="grow"></span>
      <span>支持 JSONC 注释 / 单引号 / 尾逗号</span>
    </div>
    <div class="editor-wrap">
      <div class="hl-wrap"><div class="hl" id="hlIn"></div></div>
      <textarea id="input" class="tinted wrap" spellcheck="false" placeholder='粘贴 JSON，或点击上方「来点示例」

{
  "name": "JSON 工坊",
  "works": true
}'></textarea>
      <div class="errline" id="errLine"></div>
    </div>
  </section>

  <section class="pane">
    <div class="pane-head">
      <span class="t">输出</span>
      <span class="grow"></span>
      <select id="viewMode" style="padding:3px 8px;font-size:12px">
        <option value="text">文本</option>
        <option value="tree">树形</option>
        <option value="table">路径表</option>
      </select>
      <label class="chk" id="showPathWrap" style="display:none"><input type="checkbox" id="showPaths"> 显示路径</label>
    </div>
    <div class="editor-wrap" id="outTextWrap">
      <pre class="code wrap" id="output"></pre>
    </div>
    <div class="tree-view" id="treeView" style="display:none"></div>
    <div class="table-view" id="tableView" style="display:none"></div>
  </section>
</main>

<footer>
  <span>字符 <b id="sChars">0</b></span>
  <span>行数 <b id="sLines">0</b></span>
  <span class="pill" id="sNodes">节点 0</span>
  <span class="pill" id="sDepth">深度 0</span>
  <span class="pill" id="sTime">0.0 ms</span>
  <span class="gap"></span>
  <span id="sHint">Ctrl/⌘+Enter 格式化 · 输出面板点击值可复制路径</span>
</footer>

<div id="toast"></div>

<dialog id="pathDlg">
  <div class="dlg-head"><span>JSONPath</span><span class="spacer"></span><span class="sub" style="color:var(--dim);font-size:11.5px">粘贴到代码里直接取值</span></div>
  <div class="dlg-body">
    <label>路径
      <input id="dlgPath" spellcheck="false" value="$">
    </label>
    <label>取值结果
      <textarea id="dlgValue" spellcheck="false" readonly></textarea>
    </label>
  </div>
  <div class="dlg-foot">
    <button id="dlgCopyPath">复制路径</button>
    <button id="dlgCopyValue" class="primary">复制取值</button>
    <span class="spacer"></span>
    <button id="dlgClose" class="ghost">关闭 <kbd class="esc">Esc</kbd></button>
  </div>
</dialog>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
