<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>记忆棱镜 · Memory Prism</title>
<style>
  :root {
    --bg: #0b0e17;
    --bg2: #121829;
    --panel: rgba(255,255,255,.045);
    --line: rgba(255,255,255,.09);
    --txt: #e8ecf8;
    --dim: #8b95b5;
    --gold: #ffc861;
    --cyan: #5ee7ff;
    --pink: #ff6bd6;
    --green: #55e6a5;
    --red: #ff6b6b;
    --card-r: 14px;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    color: var(--txt);
    background:
      radial-gradient(1100px 620px at 18% -12%, #1c2a4d 0%, transparent 62%),
      radial-gradient(900px 520px at 88% 108%, #2a1740 0%, transparent 60%),
      var(--bg);
    display: flex; flex-direction: column; align-items: center;
    padding: 18px 14px 26px;
    min-height: 100%;
    overflow-x: hidden;
  }
  body::before {
    /* 背景缓慢流动的极光噪点，纯 CSS，极轻 */
    content: ""; position: fixed; inset: -20%;
    background:
      radial-gradient(420px 300px at 30% 30%, rgba(94,231,255,.07), transparent 70%),
      radial-gradient(420px 300px at 70% 60%, rgba(255,107,214,.06), transparent 70%);
    animation: drift 26s ease-in-out infinite alternate;
    pointer-events: none; z-index: 0;
  }
  @keyframes drift { from { transform: translate3d(-2%, -1%, 0) scale(1); } to { transform: translate3d(3%, 2%, 0) scale(1.08); } }

  .wrap { position: relative; z-index: 1; width: 100%; max-width: 720px; }

  header { text-align: center; margin-bottom: 14px; }
  h1 {
    margin: 0; font-size: 26px; letter-spacing: .14em; font-weight: 800;
    background: linear-gradient(96deg, var(--cyan), #a78bfa 46%, var(--pink));
    -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  .sub { margin: 6px 0 0; font-size: 12px; color: var(--dim); letter-spacing: .08em; }

  .hud {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px;
    margin: 16px 0 12px;
  }
  .stat {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 6px 9px; text-align: center; position: relative; overflow: hidden;
  }
  .stat .k { font-size: 10px; color: var(--dim); letter-spacing: .12em; text-transform: uppercase; }
  .stat .v { font-size: 19px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
  .stat .v.gold { color: var(--gold); }
  .stat .v.pink { color: var(--pink); }
  .stat.pop { animation: pop .28s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 45% { transform: scale(1.07); } 100% { transform: scale(1); } }

  .timebar { height: 4px; border-radius: 99px; background: rgba(255,255,255,.08); margin: -4px 0 12px; overflow: hidden; display: none; }
  .timebar.on { display: block; }
  .timebar > i { display: block; height: 100%; width: 100%; border-radius: 99px; background: linear-gradient(90deg, var(--green), var(--cyan)); transition: width .2s linear; }
  .timebar.warn > i { background: linear-gradient(90deg, var(--gold), var(--red)); }

  .board {
    display: grid; gap: 8px; width: 100%;
    perspective: 1100px;
  }
  .board.locked { pointer-events: none; }

  .card {
    position: relative; aspect-ratio: 1 / 1; border: 0; padding: 0; background: none;
    cursor: pointer; outline: none; font: inherit; color: inherit;
    transform-style: preserve-3d; transition: transform .3s cubic-bezier(.3,.9,.35,1.2), opacity .35s ease, box-shadow .25s;
    will-change: transform;
    border-radius: var(--card-r);
  }
  .card:focus-visible { box-shadow: 0 0 0 2px var(--cyan); }
  .face {
    position: absolute; inset: 0; border-radius: var(--card-r);
    display: flex; align-items: center; justify-content: center;
    backface-visibility: hidden; -webkit-backface-visibility: hidden;
    overflow: hidden;
  }
  .back {
    background: linear-gradient(148deg, #1e2842, #151d33 60%, #221a3a);
    border: 1px solid rgba(255,255,255,.1);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.09), 0 6px 16px -8px #000;
  }
  .back::after {
    content: ""; width: 34%; height: 34%; border-radius: 50%;
    background: conic-gradient(from 0deg, var(--cyan), #a78bfa, var(--pink), var(--cyan));
    opacity: .22; filter: blur(3px);
  }
  .back::before {
    content: ""; position: absolute; inset: 7%; border-radius: 10px;
    border: 1px solid rgba(94,231,255,.14);
  }
  .front {
    transform: rotateY(180deg);
    background: linear-gradient(150deg, #24304f, #1a2137);
    border: 1px solid rgba(94,231,255,.22);
    font-size: clamp(22px, 7.4vw, 40px);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08);
  }
  .card.flip { transform: rotateY(180deg); }
  .card.matched { cursor: default; }
  .card.matched .front {
    background: linear-gradient(150deg, rgba(85,230,165,.2), rgba(94,231,255,.1));
    border-color: rgba(85,230,165,.55);
    box-shadow: 0 0 0 1px rgba(85,230,165,.3), 0 0 26px -4px rgba(85,230,165,.55);
  }
  .card.gone { opacity: 0; transform: rotateY(180deg) scale(.86); }
  .card.miss .front { animation: shake .34s; border-color: var(--red); }
  @keyframes shake {
    0%,100% { transform: rotateY(180deg) translateX(0); }
    25% { transform: rotateY(180deg) translateX(-5px); }
    60% { transform: rotateY(180deg) translateX(5px); }
    85% { transform: rotateY(180deg) translateX(-2px); }
  }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 16px; }
  button.btn {
    font: inherit; font-size: 13px; font-weight: 600; color: var(--txt);
    background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
    padding: 9px 15px; cursor: pointer; transition: .18s; letter-spacing: .03em;
  }
  button.btn:hover:not(:disabled) { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); transform: translateY(-1px); }
  button.btn:disabled { opacity: .35; cursor: not-allowed; }
  button.btn.primary { background: linear-gradient(120deg, #2a6cff22, #a78bfa22); border-color: rgba(120,160,255,.4); }
  button.btn small { opacity: .6; font-weight: 400; margin-left: 4px; }

  .levels { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 10px; }
  .lv {
    font: inherit; font-size: 12px; padding: 6px 12px; border-radius: 99px; cursor: pointer;
    background: transparent; border: 1px solid var(--line); color: var(--dim); transition: .18s;
  }
  .lv.on { color: #06121f; background: linear-gradient(120deg, var(--cyan), #a78bfa); border-color: transparent; font-weight: 700; }

  .best { text-align: center; font-size: 11px; color: var(--dim); margin-top: 12px; letter-spacing: .04em; }
  .best b { color: var(--gold); }

  /* 连击飘字 */
  .float {
    position: fixed; z-index: 40; pointer-events: none; font-weight: 800;
    font-size: 20px; color: var(--gold); text-shadow: 0 2px 12px rgba(255,200,97,.65);
    animation: floatUp .85s ease-out forwards;
  }
  @keyframes floatUp {
    0% { opacity: 0; transform: translate(-50%, 0) scale(.7); }
    22% { opacity: 1; transform: translate(-50%, -10px) scale(1.12); }
    100% { opacity: 0; transform: translate(-50%, -54px) scale(1); }
  }

  /* 结束遮罩 */
  .overlay {
    position: fixed; inset: 0; z-index: 50; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(6,9,16,.74); backdrop-filter: blur(9px);
  }
  .overlay.on { display: flex; animation: fade .24s ease-out; }
  @keyframes fade { from { opacity: 0; } to { opacity: 1; } }
  .modal {
    width: 100%; max-width: 340px; text-align: center;
    background: linear-gradient(160deg, #1a2137, #141a2b);
    border: 1px solid var(--line); border-radius: 20px; padding: 26px 22px 22px;
    box-shadow: 0 30px 80px -30px #000; animation: rise .3s cubic-bezier(.2,.9,.3,1.15);
  }
  @keyframes rise { from { transform: translateY(16px) scale(.97); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal .title { font-size: 22px; font-weight: 800; letter-spacing: .06em; }
  .modal .title.win { background: linear-gradient(96deg, var(--gold), #ff9c6b); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .modal .title.lose { color: var(--red); }
  .stars { font-size: 30px; letter-spacing: .18em; margin: 12px 0 4px; height: 38px; }
  .stars span { display: inline-block; opacity: .18; transform: scale(.8); transition: .3s; }
  .stars span.on { opacity: 1; transform: scale(1); color: var(--gold); text-shadow: 0 0 18px rgba(255,200,97,.7); }
  .modal .score { font-size: 38px; font-weight: 800; color: var(--gold); font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
  .modal .rows { margin-top: 12px; font-size: 12.5px; color: var(--dim); line-height: 1.9; }
  .modal .rows b { color: var(--txt); font-variant-numeric: tabular-nums; }
  .modal .newrec { display: none; margin-top: 8px; font-size: 12px; color: var(--green); font-weight: 700; letter-spacing: .1em; }
  .modal .newrec.on { display: block; }
  .modal .acts { display: flex; gap: 10px; margin-top: 18px; }
  .modal .acts .btn { flex: 1; padding: 11px; }

  .help { margin-top: 14px; font-size: 11.5px; color: var(--dim); text-align: center; line-height: 1.9; }
  .help kbd {
    background: rgba(255,255,255,.08); border: 1px solid var(--line); border-radius: 4px;
    padding: 1px 5px; font-size: 10.5px; font-family: inherit;
  }
  @media (max-width: 420px) {
    h1 { font-size: 21px; }
    .stat .v { font-size: 16px; }
    .board { gap: 6px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .card, .float, .overlay.on, .modal, body::before { animation: none !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>记忆棱镜</h1>
    <p class="sub">MEMORY PRISM · 翻牌配对，但记住的是节奏</p>
  </header>

  <div class="hud">
    <div class="stat" id="st-score"><div class="k">得分</div><div class="v gold" id="v-score">0</div></div>
    <div class="stat" id="st-pairs"><div class="k">配对</div><div class="v" id="v-pairs">0/0</div></div>
    <div class="stat" id="st-combo"><div class="k">连击</div><div class="v pink" id="v-combo">×0</div></div>
    <div class="stat" id="st-moves"><div class="k">翻牌</div><div class="v" id="v-moves">0</div></div>
  </div>
  <div class="timebar" id="timebar"><i id="timefill"></i></div>

  <div class="board" id="board" role="grid" aria-label="翻牌棋盘"></div>

  <div class="levels" id="levels"></div>

  <div class="controls">
    <button class="btn primary" id="btn-peek">👁 揭晓<small id="peek-left"></small></button>
    <button class="btn" id="btn-restart">↺ 重开</button>
    <button class="btn" id="btn-sound">🔊 音效</button>
  </div>

  <div class="best" id="best"></div>

  <div class="help">
    <kbd>空格</kbd> 揭晓 · <kbd>R</kbd> 重开 · <kbd>1</kbd>~<kbd>4</kbd> 切难度 &nbsp;|&nbsp; 连续配对有连击加成，配错扣分并清零连击
  </div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <div class="title" id="ov-title">通关</div>
    <div class="stars" id="ov-stars"><span>★</span><span>★</span><span>★</span></div>
    <div class="score" id="ov-score">0</div>
    <div class="newrec" id="ov-rec">✦ 新纪录 ✦</div>
    <div class="rows" id="ov-rows"></div>
    <div class="acts">
      <button class="btn" id="ov-close">看看棋盘</button>
      <button class="btn primary" id="ov-again">再来一局</button>
    </div>
  </div>
</div>

<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
