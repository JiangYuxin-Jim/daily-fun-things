<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>今词 · 每日猜词</title>
<style>
:root{
  --bg:#0f1115; --panel:#171a21; --line:#2a2f3a; --text:#e7e9ee; --dim:#8b93a3;
  --absent:#3a3f4b; --present:#c9a227; --correct:#2e9e5b; --accent:#6c8cff;
  --tile:#1d212b;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{
  background:radial-gradient(1200px 600px at 50% -10%, #1b2030 0%, var(--bg) 60%);
  color:var(--text); font-family:"SF Mono",ui-monospace,Menlo,Consolas,"PingFang SC","Microsoft YaHei",monospace;
  display:flex; flex-direction:column; align-items:center; min-height:100%;
  padding:14px 10px 18px; user-select:none;
}
header{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.brand{display:flex;align-items:baseline;gap:8px}
.brand h1{font-size:20px;margin:0;letter-spacing:.14em;font-weight:700}
.brand small{color:var(--dim);font-size:11px;letter-spacing:.08em}
.icons{display:flex;gap:6px}
button{font-family:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
  color:var(--text);border-radius:9px;padding:7px 11px;font-size:13px;transition:.15s}
button:hover{border-color:#3e4656;background:#1d222c}
button:active{transform:scale(.96)}
.sub{width:100%;max-width:520px;display:flex;justify-content:space-between;align-items:center;
  color:var(--dim);font-size:12px;margin:8px 0 4px;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);border-radius:99px;padding:2px 9px;font-size:11px;color:var(--dim)}
.chip.on{color:#cfe0ff;border-color:#3c5bd6;background:#1a2140}

#boardWrap{flex:1;display:flex;flex-direction:column;justify-content:center;width:100%;max-width:330px;position:relative}
#board{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;aspect-ratio:5/6;width:100%}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{display:flex;align-items:center;justify-content:center;background:var(--tile);
  border:2px solid var(--line);border-radius:8px;font-size:clamp(20px,7vw,30px);
  font-weight:700;text-transform:uppercase;transition:background .18s,border-color .18s;position:relative}
.tile.filled{border-color:#4a5364;animation:pop .12s ease-out}
@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}
.tile.flip{animation:flip .48s ease forwards}
@keyframes flip{0%{transform:rotateX(0)}49%{transform:rotateX(90deg)}50%{background:var(--tile)}100%{transform:rotateX(0)}}
.tile.absent{background:var(--absent);border-color:var(--absent);color:#cfd4de}
.tile.present{background:var(--present);border-color:var(--present);color:#1a1500}
.tile.correct{background:var(--correct);border-color:var(--correct);color:#fff}
.row.shake{animation:shake .38s}
@keyframes shake{10%,90%{transform:translateX(-2px)}30%,70%{transform:translateX(4px)}50%{transform:translateX(-5px)}}
.tile.win{animation:bounce .55s}
@keyframes bounce{0%,100%{transform:translateY(0)}35%{transform:translateY(-14px)}70%{transform:translateY(4px)}}

#keyboard{width:100%;max-width:520px;margin-top:10px;display:flex;flex-direction:column;gap:6px}
.krow{display:flex;gap:5px;justify-content:center}
.key{flex:1;min-width:0;height:46px;border-radius:7px;background:#2d323d;border:0;color:var(--text);
  font-size:13px;font-weight:600;text-transform:uppercase;display:flex;align-items:center;justify-content:center;
  transition:background .18s,color .18s;padding:0}
.key.wide{flex:1.6;font-size:11px}
.key.absent{background:#14171d;color:#5c6474}
.key.present{background:var(--present);color:#1a1500}
.key.correct{background:var(--correct);color:#fff}
.hintbar{width:100%;max-width:520px;height:22px;text-align:center;font-size:12px;color:var(--dim);margin-top:6px}
.hintbar b{color:var(--accent);letter-spacing:.2em}

#overlay{position:fixed;inset:0;background:rgba(6,8,12,.78);display:none;align-items:center;
  justify-content:center;padding:20px;z-index:20;backdrop-filter:blur(3px)}
#overlay.show{display:flex}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px;
  max-width:400px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5)}
.card h2{margin:0 0 6px;font-size:19px}
.card p{color:var(--dim);font-size:13px;line-height:1.7;margin:6px 0}
.card .answer{font-size:26px;letter-spacing:.24em;color:var(--correct);font-weight:700;text-align:center;margin:12px 0;text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:#11141a;border:1px solid var(--line);border-radius:10px;padding:9px 4px;text-align:center}
.stat b{display:block;font-size:18px;color:var(--text)}
.stat span{font-size:10px;color:var(--dim)}
.dist{display:flex;flex-direction:column;gap:5px;margin:10px 0 14px;font-size:11px;color:var(--dim)}
.dist .d{display:flex;align-items:center;gap:7px}
.dist .bar{height:16px;background:var(--present);border-radius:3px;min-width:18px;display:flex;
  align-items:center;justify-content:flex-end;padding-right:5px;color:#1a1500;font-weight:700;
  transition:width .5s ease;font-size:10px}
.dist .bar.zero{background:#232833;color:#5c6474}
.dist .bar.me{background:var(--correct);color:#fff}
.card .acts{display:flex;gap:8px;margin-top:6px}
.card .acts button{flex:1;padding:11px}
.card .acts .primary{background:#2a3a7a;border-color:#3c5bd6;color:#dbe4ff}
.timeline{display:flex;flex-direction:column;gap:5px;margin-top:8px;max-height:200px;overflow:auto}
.tl{display:flex;gap:3px;align-items:center;font-size:11px;color:var(--dim)}
.tl .c{width:14px;height:14px;border-radius:3px;background:var(--absent)}
.tl .c.present{background:var(--present)} .tl .c.correct{background:var(--correct)}
.tl .w{letter-spacing:.12em;color:#c8cedb;margin-left:6px}
#toast{position:fixed;top:14px;left:50%;transform:translate(-50%,-80px);background:#e7e9ee;color:#0f1115;
  padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;transition:.25s;z-index:30;pointer-events:none}
#toast.show{transform:translate(-50%,0)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
@media(max-width:380px){ .key{height:42px;font-size:12px} #boardWrap{max-width:300px} }
</style>
</head>
<body>
<header>
  <div class="brand"><h1>今词</h1><small>DAILY WORD</small></div>
  <div class="icons">
    <button id="btnHint" title="AI 提示（不揭晓答案）">💡 提示</button>
    <button id="btnStats" title="统计">📊</button>
    <button id="btnHelp" title="玩法">?</button>
  </div>
</header>

<div class="sub">
  <div style="display:flex;gap:6px;flex-wrap:wrap">
    <span class="chip on" data-mode="daily" id="chipDaily">每日挑战</span>
    <span class="chip" data-mode="practice" id="chipPractice">自由练习</span>
  </div>
  <div style="display:flex;gap:6px">
    <span class="chip" id="chipHard">困难模式</span>
  </div>
</div>
<div class="sub" style="margin-top:0">
  <span id="subLeft">第 1 / 6 次</span>
  <span id="subHard" style="visibility:hidden">已开困难模式</span>
</div>

<div id="boardWrap"><div id="board"></div></div>
<div class="hintbar" id="hintbar"></div>
<div id="keyboard"></div>

<div id="overlay"><div class="card" id="card"></div></div>
<div id="toast"></div>
<div class="sr" id="live" aria-live="polite"></div>

<script src="words.js"></script>
<script src="core.js"></script>
<script src="app.js"></script>
</body>
</html>
