<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>提示词工坊 · Prompt Forge</title>
<style>
  :root {
    --bg: #0d1017;
    --panel: #141924;
    --panel2: #1a2130;
    --line: #242c3d;
    --txt: #e6ebf5;
    --dim: #8492ad;
    --acc: #6ee7b7;
    --acc2: #7dd3fc;
    --warn: #fbbf24;
    --bad: #f87171;
    --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: radial-gradient(1200px 600px at 15% -10%, #17233a 0%, var(--bg) 55%);
    color: var(--txt); font: 15px/1.65 -apple-system, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    min-height: 100vh;
  }
  header { padding: 22px 28px 6px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  h1 { margin: 0; font-size: 22px; letter-spacing: .5px; }
  h1 span { color: var(--acc); }
  header p { margin: 0; color: var(--dim); font-size: 13px; }
  .wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; padding: 14px 28px 40px; }
  @media (max-width: 900px) { .wrap { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 13px; color: var(--dim); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
  textarea {
    width: 100%; min-height: 240px; resize: vertical; background: var(--panel2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 14px/1.7 var(--mono);
    outline: none;
  }
  textarea:focus { border-color: #35507a; }
  .meta { display: flex; gap: 14px; color: var(--dim); font-size: 12px; margin-top: 8px; font-variant-numeric: tabular-nums; }
  .meta b { color: var(--txt); font-weight: 600; }
  .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 12px; }
  .opts label { font-size: 12px; color: var(--dim); display: block; }
  .opts input, .opts select {
    width: 100%; margin-top: 3px; background: var(--panel2); color: var(--txt);
    border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 13px; outline: none;
  }
  .opts input:focus, .opts select:focus { border-color: #35507a; }
  .row { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
  button {
    cursor: pointer; border-radius: 9px; border: 1px solid var(--line); background: var(--panel2);
    color: var(--txt); padding: 9px 15px; font-size: 13.5px; font-weight: 600; transition: .15s;
  }
  button:hover { border-color: #3b4a68; transform: translateY(-1px); }
  button.primary { background: linear-gradient(135deg, #34d399, #22d3ee); color: #06201b; border: none; }
  button.primary:hover { filter: brightness(1.08); }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--dim); cursor: pointer; }
  .chk input { accent-color: var(--acc); }

  /* 分数环 */
  .scorebox { display: flex; gap: 16px; align-items: center; margin-bottom: 12px; }
  .ring { position: relative; width: 84px; height: 84px; flex: none; }
  .ring svg { transform: rotate(-90deg); }
  .ring .val {
    position: absolute; inset: 0; display: grid; place-items: center;
    font: 700 22px/1 var(--mono); font-variant-numeric: tabular-nums;
  }
  .grade { font: 700 12px/1 var(--mono); padding: 3px 7px; border-radius: 6px; background: #1d2941; color: var(--acc2); }
  .issues { display: flex; flex-direction: column; gap: 7px; max-height: 300px; overflow: auto; }
  .issue { background: var(--panel2); border-left: 3px solid var(--warn); border-radius: 6px; padding: 8px 11px; font-size: 13px; }
  .issue .t { font-weight: 600; color: #ffd479; }
  .issue .d { color: var(--dim); font-size: 12.5px; margin-top: 2px; }
  .ok { color: var(--acc); font-size: 13px; }
  .empty-tip { color: var(--dim); font-size: 13px; }

  .out {
    background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 12px;
    font: 13px/1.7 var(--mono); white-space: pre-wrap; word-break: break-word;
    max-height: 360px; overflow: auto; min-height: 120px;
  }
  .out .add { background: rgba(110,231,183,.10); color: #a8f0d4; }
  .out .del { background: rgba(248,113,113,.10); color: #ffb4b4; text-decoration: line-through; opacity: .75; }
  .out .same { color: #9aa8c2; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { font-size: 12.5px; padding: 5px 11px; border-radius: 7px; border: 1px solid var(--line); cursor: pointer; color: var(--dim); }
  .tab.on { color: var(--txt); background: #22304a; border-color: #35507a; }
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translate(-50%, 20px); background: #1f2b3f;
    border: 1px solid #3b4a68; color: var(--txt); padding: 9px 18px; border-radius: 999px; font-size: 13px;
    opacity: 0; pointer-events: none; transition: .25s; }
  .toast.on { opacity: 1; transform: translate(-50%, 0); }
  footer { text-align: center; color: #566079; font-size: 12px; padding-bottom: 26px; }
</style>
</head>
<body>
<header>
  <h1>提示词工坊 <span>Prompt Forge</span></h1>
  <p>诊断 → 优化 → 对比，纯本地运行，不联网、不上传</p>
</header>

<div class="wrap">
  <!-- 左：输入 -->
  <section class="card">
    <h2>你的提示词</h2>
    <textarea id="input" placeholder="把你想发给 AI 的话原样粘进来，比如：

请问你能帮我优化一下这个方案吗，让它更好一些，谢谢"></textarea>
    <div class="meta">
      <span>字数 <b id="mChars">0</b></span>
      <span>约 <b id="mTokens">0</b> tokens</span>
    </div>

    <div class="opts">
      <label>角色（留空用默认）<input id="role" placeholder="资深产品经理" /></label>
      <label>受众<input id="audience" placeholder="刚入行的新人" /></label>
      <label>篇幅<input id="length" placeholder="300 字以内" /></label>
      <label>输出格式
        <select id="format">
          <option value="Markdown 小标题 + 分点列表">Markdown 分点</option>
          <option value="Markdown 表格，列为：项目 / 说明 / 优先级">Markdown 表格</option>
          <option value="合法 JSON，不要包含任何解释文字">JSON</option>
          <option value="编号步骤清单">编号步骤</option>
          <option value="一段连贯的短文，不分点">连贯短文</option>
        </select>
      </label>
    </div>

    <div class="row">
      <button class="primary" id="btnForge">⚡ 开始锻造</button>
      <button id="btnFill">填入示例</button>
      <label class="chk"><input type="checkbox" id="strict" /> 严格模式</label>
    </div>
  </section>

  <!-- 右：诊断 -->
  <section class="card">
    <h2>诊断</h2>
    <div class="scorebox">
      <div class="ring">
        <svg width="84" height="84" viewBox="0 0 84 84">
          <circle cx="42" cy="42" r="36" fill="none" stroke="#1e2637" stroke-width="7" />
          <circle id="arc" cx="42" cy="42" r="36" fill="none" stroke="#6ee7b7" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="226.2" stroke-dashoffset="226.2" />
        </svg>
        <div class="val" id="scoreVal">–</div>
      </div>
      <div>
        <div class="grade" id="grade">未评分</div>
        <div style="font-size:12px;color:var(--dim);margin-top:6px" id="scoreNote">写下提示词后点「开始锻造」</div>
      </div>
    </div>
    <div class="issues" id="issues"><div class="empty-tip">这里会列出扣分项和对应的改法。</div></div>
  </section>

  <!-- 全宽：结果 -->
  <section class="card" style="grid-column: 1 / -1">
    <h2>锻造结果</h2>
    <div class="tabs">
      <div class="tab on" data-tab="diff">差异对比</div>
      <div class="tab" data-tab="out">优化稿</div>
    </div>
    <div class="out" id="out"><span class="empty-tip">还没有结果。</span></div>
    <div class="row">
      <button id="btnCopy">复制优化稿</button>
      <span class="meta" style="margin-top:0" id="gain"></span>
    </div>
  </section>
</div>
<footer>Prompt Forge · 规则驱动的本地提示词体检 · 零依赖单页应用</footer>
<div class="toast" id="toast"></div>

<script src="engine.js"></script>
<script>
(function () {
  const P = window.PromptForge;
  const input = document.getElementById('input');
  const outEl = document.getElementById('out');
  const issuesEl = document.getElementById('issues');
  const arc = document.getElementById('arc');
  const scoreVal = document.getElementById('scoreVal');
  const gradeEl = document.getElementById('grade');
  const scoreNote = document.getElementById('scoreNote');
  const gainEl = document.getElementById('gain');
  const toastEl = document.getElementById('toast');
  let lastResult = '';
  let tab = 'diff';

  const SAMPLE = '请问你能帮我优化一下这个方案吗，让它更好一些，然后顺便看看有没有风险，再给我一些建议，谢谢';

  function toast(msg) {
    toastEl.textContent = msg;
    toastEl.classList.add('on');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toastEl.classList.remove('on'), 1600);
  }

  function colorOf(s) {
    if (s >= 85) return '#6ee7b7';
    if (s >= 70) return '#7dd3fc';
    if (s >= 55) return '#fbbf24';
    return '#f87171';
  }

  function updateMeta() {
    const t = input.value;
    document.getElementById('mChars').textContent = t.replace(/\s/g, '').length;
    document.getElementById('mTokens').textContent = P.estimateTokens(t);
  }

  function renderScore(a) {
    const C = 2 * Math.PI * 36;
    const c = colorOf(a.score);
    arc.setAttribute('stroke', c);
    arc.setAttribute('stroke-dashoffset', String(C * (1 - a.score / 100)));
    scoreVal.textContent = a.score;
    scoreVal.style.color = c;
    gradeEl.textContent = '等级 ' + a.grade;
    gradeEl.style.color = c;
    scoreNote.textContent = a.stats.chars ? '共 ' + a.stats.chars + ' 字符 · 约 ' + a.stats.estTokens + ' tokens' : '还没写内容';
  }

  function renderIssues(a) {
    if (!a.issues.length) {
      issuesEl.innerHTML = '<div class="ok">✓ 没发现明显问题，这条提示词结构完整。</div>';
      return;
    }
    issuesEl.innerHTML = '';
    a.issues.forEach((it) => {
      const d = document.createElement('div');
      d.className = 'issue';
      const t = document.createElement('div');
      t.className = 't';
      t.textContent = '−' + it.weight + '  ' + it.label;
      const dd = document.createElement('div');
      dd.className = 'd';
      dd.textContent = it.advise;
      d.appendChild(t);
      d.appendChild(dd);
      issuesEl.appendChild(d);
    });
  }

  function esc(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  function renderOut() {
    if (!lastResult) {
      outEl.innerHTML = '<span class="empty-tip">还没有结果。</span>';
      return;
    }
    if (tab === 'out') {
      outEl.textContent = lastResult;
      return;
    }
    const d = P.diffLines(input.value.trim(), lastResult);
    outEl.innerHTML = d.map((x) => {
      const sign = x.type === 'add' ? '+ ' : x.type === 'del' ? '− ' : '  ';
      return '<div class="' + x.type + '">' + esc(sign + x.text) + '</div>';
    }).join('');
  }

  function forge() {
    const src = input.value;
    const a = P.analyze(src);
    renderScore(a);
    renderIssues(a);
    if (!src.trim()) {
      lastResult = '';
      gainEl.textContent = '';
      renderOut();
      return;
    }
    const fmt = document.getElementById('format').value;
    const res = P.improve(src, {
      role: document.getElementById('role').value,
      audience: document.getElementById('audience').value,
      lengthLimit: document.getElementById('length').value,
      format: fmt,
      strict: document.getElementById('strict').checked
    });
    lastResult = res;
    const after = P.analyze(res);
    gainEl.innerHTML = '健康分 <b>' + a.score + ' → ' + after.score + '</b>';
    renderOut();
  }

  document.getElementById('btnForge').addEventListener('click', forge);
  document.getElementById('btnFill').addEventListener('click', () => {
    input.value = SAMPLE;
    updateMeta();
    forge();
  });
  input.addEventListener('input', updateMeta);
  input.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') { e.preventDefault(); forge(); }
  });

  document.querySelectorAll('.tab').forEach((t) => {
    t.addEventListener('click', () => {
      document.querySelectorAll('.tab').forEach((x) => x.classList.remove('on'));
      t.classList.add('on');
      tab = t.dataset.tab;
      renderOut();
    });
  });

  document.getElementById('btnCopy').addEventListener('click', () => {
    if (!lastResult) { toast('还没有优化稿'); return; }
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(lastResult).then(() => toast('已复制 ✓'), () => fallbackCopy());
    } else fallbackCopy();
    function fallbackCopy() {
      const ta = document.createElement('textarea');
      ta.value = lastResult;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('已复制 ✓'); } catch (e) { toast('复制失败，请手动选择'); }
      document.body.removeChild(ta);
    }
  });

  updateMeta();
})();
</script>
</body>
</html>
