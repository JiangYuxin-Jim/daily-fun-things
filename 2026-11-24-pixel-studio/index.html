<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>像素工坊 · Pixel Studio</title>
<style>
  :root{
    --bg:#12141c; --panel:#1b1e28; --panel2:#232736; --line:#31364a;
    --ink:#e8ecf6; --dim:#8b93ab; --accent:#ffcc4d; --accent2:#5ac8fa;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:radial-gradient(1200px 700px at 50% -10%,#242a3d,#12141c 60%);
    color:var(--ink);font:14px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:16px 12px 28px;user-select:none;
  }
  h1{margin:0 0 2px;font-size:19px;letter-spacing:.5px}
  h1 small{font-weight:400;font-size:12px;color:var(--dim);letter-spacing:1px}
  .sub{color:var(--dim);font-size:12px;margin-bottom:14px}
  .wrap{display:flex;gap:16px;align-items:flex-start;flex-wrap:wrap;justify-content:center;max-width:1080px}
  .stage{position:relative;padding:10px;border-radius:14px;background:var(--panel);border:1px solid var(--line);box-shadow:0 18px 40px #0009}
  canvas#grid{display:block;image-rendering:pixelated;border-radius:6px;cursor:crosshair;touch-action:none;
    background-image:linear-gradient(45deg,#2a2f42 25%,transparent 25%,transparent 75%,#2a2f42 75%),
                     linear-gradient(45deg,#2a2f42 25%,transparent 25%,transparent 75%,#2a2f42 75%);
    background-size:16px 16px;background-position:0 0,8px 8px}
  .side{display:flex;flex-direction:column;gap:10px;width:300px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px}
  .card h2{margin:0 0 8px;font-size:11px;letter-spacing:1.5px;color:var(--dim);font-weight:600;text-transform:uppercase}
  .row{display:flex;gap:6px;flex-wrap:wrap}
  button{font:inherit;font-size:12px;color:var(--ink);background:var(--panel2);border:1px solid var(--line);
    border-radius:8px;padding:6px 9px;cursor:pointer;transition:.12s}
  button:hover{background:#2d3247;border-color:#455070}
  button.on{background:var(--accent);color:#221a00;border-color:var(--accent);font-weight:700}
  button:disabled{opacity:.35;cursor:not-allowed}
  button.wide{flex:1}
  .tools{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
  .tools button{padding:8px 2px;font-size:16px;line-height:1}
  .tools button b{display:block;font-size:9px;font-weight:500;margin-top:3px;color:var(--dim);letter-spacing:.5px}
  .tools button.on b{color:#4a3600}
  .pal{display:grid;grid-template-columns:repeat(9,1fr);gap:4px}
  .sw{aspect-ratio:1;border-radius:5px;border:1px solid #0006;cursor:pointer;position:relative}
  .sw.on{outline:2px solid var(--accent);outline-offset:1px}
  input[type=color]{width:38px;height:30px;border:1px solid var(--line);border-radius:7px;background:var(--panel2);padding:2px;cursor:pointer}
  .meta{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}
  .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--dim);cursor:pointer}
  .chk input{accent-color:var(--accent)}
  #preview{image-rendering:pixelated;background:#0c0e14;border-radius:8px;width:88px;height:88px;border:1px solid var(--line)}
  .pv{display:flex;gap:10px;align-items:center}
  .pv .txt{font-size:11px;color:var(--dim);line-height:1.5}
  .hint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.6}
  kbd{background:#2b3145;border:1px solid #3b4260;border-bottom-width:2px;border-radius:4px;padding:0 4px;font-size:10px;font-family:ui-monospace,monospace}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--accent);color:#221a00;
    font-weight:700;font-size:13px;padding:8px 16px;border-radius:20px;opacity:0;pointer-events:none;transition:.25s}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  @media(max-width:700px){ .side{width:min(92vw,420px)} canvas#grid{max-width:92vw;height:auto!important} }
</style>
</head>
<body>
<h1>像素工坊 <small>PIXEL STUDIO</small></h1>
<div class="sub">画一个小人 · 看着它活过来 · 一键导出</div>

<div class="wrap">
  <div class="stage">
    <canvas id="grid"></canvas>
  </div>

  <div class="side">
    <div class="card">
      <h2>工具</h2>
      <div class="tools" id="tools">
        <button data-tool="pen" class="on">✏️<b>画笔</b></button>
        <button data-tool="eraser">🧽<b>橡皮</b></button>
        <button data-tool="fill">🪣<b>填充</b></button>
        <button data-tool="line">📏<b>直线</b></button>
        <button data-tool="rect">▭<b>方框</b></button>
        <button data-tool="picker">💧<b>取色</b></button>
      </div>
      <div class="row" style="margin-top:8px">
        <label class="chk"><input type="checkbox" id="mirror"> 镜像对称</label>
        <label class="chk"><input type="checkbox" id="shade"> 抖动阴影</label>
      </div>
    </div>

    <div class="card">
      <h2>调色板</h2>
      <div class="pal" id="pal"></div>
      <div class="row" style="margin-top:8px;align-items:center">
        <input type="color" id="pick" value="#ffcc4d">
        <button id="addSw" class="wide">+ 存进调色板</button>
      </div>
    </div>

    <div class="card">
      <h2>蹦跳预览</h2>
      <div class="pv">
        <canvas id="preview" width="88" height="88"></canvas>
        <div class="txt">这是你的小作品<br>按 <b>空格</b> 暂停/播放<br>画完点「导出」拿大图</div>
      </div>
    </div>

    <div class="card">
      <h2>历史与导出</h2>
      <div class="row">
        <button id="undo">↩ 撤销</button>
        <button id="redo">↪ 重做</button>
        <button id="clear">清空</button>
      </div>
      <div class="row" style="margin-top:8px">
        <button id="export" class="wide">⬇ 导出 PNG（×8）</button>
        <button id="savejson" title="保存 .json">💾</button>
        <button id="loadjson" title="载入 .json">📂</button>
      </div>
      <div class="meta" style="margin-top:8px">
        尺寸 <button id="sz-" style="padding:2px 7px">−</button><span id="szTxt">16 × 16</span><button id="sz+" style="padding:2px 7px">+</button>
      </div>
    </div>

    <div class="hint">
      <kbd>B</kbd>画笔 <kbd>E</kbd>橡皮 <kbd>G</kbd>填充 <kbd>L</kbd>直线 <kbd>R</kbd>方框 <kbd>I</kbd>取色<br>
      <kbd>⌃Z</kbd>撤销 <kbd>⌃⇧Z</kbd>重做 · 右键 = 橡皮 · 滚轮缩放
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="studio.js"></script>
</body>
</html>
