<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>人生刻度 · Life in Weeks</title>
<style>
  :root{
    --bg:#0d1017; --bg2:#131824; --line:#232b3d; --fg:#e8edf7; --dim:#7d8799;
    --accent:#4dd4c4; --accent2:#ffb86b; --hot:#ff6b8b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(1200px 600px at 80% -10%, #1a2233 0%, var(--bg) 55%);
    color:var(--fg); min-height:100vh; padding:32px 20px 64px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:940px;margin:0 auto}
  header{margin-bottom:26px}
  h1{font-size:26px;font-weight:600;letter-spacing:-.5px;display:flex;align-items:center;gap:10px}
  h1 .dot{width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px var(--accent);animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.45;transform:scale(.8)}}
  .sub{color:var(--dim);font-size:13px;margin-top:7px;line-height:1.6}

  .setup{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;background:var(--bg2);
    border:1px solid var(--line);border-radius:14px;padding:16px 18px;margin:20px 0}
  .field{display:flex;flex-direction:column;gap:6px}
  .field label{font-size:11px;color:var(--dim);letter-spacing:.6px;text-transform:uppercase}
  input[type=date],input[type=number]{
    background:#0a0d14;border:1px solid var(--line);color:var(--fg);border-radius:9px;
    padding:9px 11px;font-size:14px;font-family:inherit;outline:none;transition:border .2s,box-shadow .2s;
  }
  input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(77,212,196,.12)}
  input[type=number]{width:92px}
  button{
    background:linear-gradient(135deg,var(--accent),#3fb8a9);color:#06231f;border:0;border-radius:9px;
    padding:10px 20px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;
    transition:transform .15s,filter .2s;
  }
  button:hover{filter:brightness(1.1);transform:translateY(-1px)}
  button:active{transform:translateY(0)}
  button.ghost{background:transparent;border:1px solid var(--line);color:var(--dim);font-weight:500}
  button.ghost:hover{color:var(--fg);border-color:#3a455e}

  .hero{display:flex;flex-wrap:wrap;gap:22px;align-items:center;margin:30px 0 8px}
  .hero .big{flex:1;min-width:240px}
  .big .label{font-size:12px;color:var(--dim);letter-spacing:1.2px;text-transform:uppercase}
  .big .num{font-size:clamp(48px,11vw,84px);font-weight:200;line-height:1;letter-spacing:-3px;
    font-variant-numeric:tabular-nums;color:var(--accent);text-shadow:0 0 40px rgba(77,212,196,.25)}
  .big .num small{font-size:.28em;letter-spacing:0;color:var(--dim);margin-left:10px;font-weight:400}
  .big .note{color:var(--dim);font-size:13px;margin-top:10px;line-height:1.7}
  .big .note b{color:var(--fg);font-weight:600}

  .bar{height:8px;border-radius:99px;background:#1b2230;overflow:hidden;margin:14px 0 4px;position:relative}
  .bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--accent),var(--accent2),var(--hot));
    width:0;transition:width 1.2s cubic-bezier(.2,.8,.2,1)}
  .barlabel{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);margin-top:6px}

  .grid{margin:36px 0 10px}
  .gridhead{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;flex-wrap:wrap;gap:8px}
  .gridhead h2{font-size:14px;font-weight:600;color:var(--dim);letter-spacing:.6px}
  .legend{display:flex;gap:14px;font-size:11px;color:var(--dim);align-items:center}
  .legend span{display:flex;align-items:center;gap:5px}
  .sw{width:10px;height:10px;border-radius:2px;display:inline-block}
  .cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(10px,1fr));gap:3px}
  .cell{aspect-ratio:1;border-radius:2px;background:#1a2130}
  .cell.past{background:#2f3d52}
  .cell.now{background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 1.8s infinite}
  .cell.future{background:#1a2130}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:34px}
  .card{background:var(--bg2);border:1px solid var(--line);border-radius:12px;padding:15px 16px}
  .card .k{font-size:11px;color:var(--dim);letter-spacing:.5px}
  .card .v{font-size:21px;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.5px}
  .card .v small{font-size:12px;color:var(--dim);margin-left:3px;letter-spacing:0}
  .card.warm{border-color:rgba(255,184,107,.28)}
  .card.warm .v{color:var(--accent2)}

  .quote{margin-top:34px;padding:20px 24px;border-left:2px solid var(--hot);color:#c9d3e2;
    font-size:14px;line-height:1.9;background:linear-gradient(90deg,rgba(255,107,139,.06),transparent)}
  .quote em{color:var(--dim);font-style:normal;display:block;margin-top:8px;font-size:12px}
  footer{margin-top:30px;color:#4c5567;font-size:11px;text-align:center;line-height:1.8}
  .hide{display:none!important}
  @media(max-width:520px){ .cards{grid-template-columns:repeat(2,1fr)} .cells{gap:2px} }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1><span class="dot"></span>人生刻度</h1>
    <p class="sub">把一辈子摊成一张格子纸。数据全部在本地计算，输完就忘。</p>
  </header>

  <div class="setup">
    <div class="field">
      <label>出生日期</label>
      <input type="date" id="birth">
    </div>
    <div class="field">
      <label>预期寿命</label>
      <input type="number" id="exp" min="1" max="130" value="80">
    </div>
    <button id="go">开始</button>
    <button class="ghost" id="reset">清除</button>
  </div>

  <div id="out" class="hide">
    <div class="hero">
      <div class="big">
        <div class="label">已度过</div>
        <div class="num" id="pct">0<small>%</small></div>
        <div class="note" id="note"></div>
      </div>
    </div>
    <div class="bar"><i id="barfill"></i></div>
    <div class="barlabel"><span id="livedTxt"></span><span id="leftTxt"></span></div>

    <div class="grid">
      <div class="gridhead">
        <h2>一格 = 一周</h2>
        <div class="legend">
          <span><i class="sw" style="background:#2f3d52"></i>已过</span>
          <span><i class="sw" style="background:var(--accent)"></i>此刻</span>
          <span><i class="sw" style="background:#1a2130"></i>未至</span>
        </div>
      </div>
      <div class="cells" id="cells"></div>
    </div>

    <div class="cards" id="cards"></div>

    <div class="quote" id="quote"></div>
  </div>

  <footer>人生刻度 · daily-fun-things Day 26<br>无账号、无网络、无上传 · 刷新即清空</footer>
</div>

<script src="life.js"></script>
<script>
(function(){
  var $ = function(id){ return document.getElementById(id); };
  var KEY = 'life-countdown-birth';
  var cardsEl = $('cards');

  function fmtInt(n){ return LifeCalc.fmtNum(n); }

  function render(r){
    $('out').classList.remove('hide');
    var pct = (r.pct * 100);
    $('pct').innerHTML = pct.toFixed(pct < 10 ? 2 : 1) + '<small>%</small>';

    var note = '你已经活了 <b>' + fmtInt(r.livedDays) + '</b> 天，';
    if (r.leftDays > 0) {
      note += '大概还剩 <b>' + fmtInt(r.leftDays) + '</b> 天';
      note += '，约 <b>' + Math.floor(r.yearsLeft) + '</b> 年。';
    } else {
      note += '按 ' + r.expectancy + ' 岁的预期，已经走完了整张格子。';
    }
    $('note').innerHTML = note;

    requestAnimationFrame(function(){ $('barfill').style.width = (r.pct * 100).toFixed(3) + '%'; });
    $('livedTxt').textContent = '已过 ' + fmtInt(r.livedDays) + ' 天';
    $('leftTxt').textContent = '剩余 ' + fmtInt(r.leftDays) + ' 天';

    // 周格子
    var cells = $('cells');
    cells.innerHTML = '';
    var frag = document.createDocumentFragment();
    var shown = Math.min(r.totalWeeks, 5200);
    for (var i = 0; i < shown; i++) {
      var d = document.createElement('div');
      d.className = 'cell ' + (i < r.livedWeeks ? 'past' : (i === r.livedWeeks ? 'now' : 'future'));
      frag.appendChild(d);
    }
    cells.appendChild(frag);

    // 卡片
    var items = [
      ['距离下一个生日', r.nextBirthdayIn + ' 天', ''],
      ['今年周岁', r.ageYears + ' 岁', ''],
      ['剩余夏天', r.left.summers + ' 个', 'warm'],
      ['剩余满月', fmtInt(r.left.fullMoons) + ' 次', 'warm'],
      ['剩余周末', fmtInt(r.left.weekends) + ' 天', 'warm'],
      ['已呼吸', fmtInt(r.stats.breaths) + ' 次', ''],
      ['心跳', fmtInt(r.stats.heartbeats) + ' 下', ''],
      ['已度过周末', fmtInt(r.weekends) + ' 天', '']
    ];
    cardsEl.innerHTML = items.map(function(it){
      return '<div class="card ' + it[2] + '"><div class="k">' + it[0] + '</div><div class="v">' + it[1] + '</div></div>';
    }).join('');

    var quotes = [
      ['你不需要每天都精彩，只需要别把格子浪费在等一个更好的开始上。', '— 给此刻的你'],
      ['剩下的天数不算少，但每一格都只来一次。', '— 人生刻度'],
      ['把日子过成能记住的样子，比把日历过完更重要。', '— 给此刻的你'],
      ['时间不会提醒你，所以我们做了这张表。', '— 人生刻度']
    ];
    var q = quotes[r.livedDays % quotes.length];
    $('quote').innerHTML = q[0] + '<em>' + q[1] + '</em>';
  }

  function run(){
    var birth = $('birth').value;
    var exp = parseInt($('exp').value, 10) || 80;
    try {
      var r = LifeCalc.compute({ birth: birth, expectancy: exp });
      localStorage.setItem(KEY, JSON.stringify({ b: birth, e: exp }));
      render(r);
    } catch (e) {
      alert('请输入有效的出生日期');
    }
  }

  $('go').addEventListener('click', run);
  $('reset').addEventListener('click', function(){
    localStorage.removeItem(KEY);
    $('birth').value = '';
    $('exp').value = 80;
    $('out').classList.add('hide');
  });

  // 恢复上次输入
  try {
    var saved = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (saved && saved.b) { $('birth').value = saved.b; $('exp').value = saved.e || 80; run(); }
  } catch(e){}
})();
</script>
</body>
</html>
